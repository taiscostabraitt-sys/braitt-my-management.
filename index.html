<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#242424"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="BRAITT"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><title>BRAITT | My Management</title>
<style>
:root{--bg:#f5f4f1;--paper:#fff;--ink:#252525;--muted:#747474;--line:#e5e2dc;--gold:#b49155;--dark:#242424;--red:#a34e4e;--green:#447761}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'Segoe UI',Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}aside{width:244px;position:fixed;inset:0 auto 0 0;background:var(--dark);color:#fff;padding:27px 14px;overflow:auto}aside h1{font:26px Georgia,serif;letter-spacing:2px;margin:0 12px}aside small{display:block;margin:4px 12px 32px;color:#c4aa7c;letter-spacing:2px;font-size:10px}nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;color:#ddd;border:0;text-align:left;padding:12px 14px;margin:3px 0;border-radius:7px}nav button.active,nav button:hover{background:#3b3a38;color:#d9be8b}nav span{font-size:18px;width:24px}main{margin-left:244px;max-width:1600px;padding:34px 38px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}.eyebrow{font-size:11px;letter-spacing:2px;color:#ae8950;font-weight:700;text-transform:uppercase}h2{font:32px Georgia,serif;margin:5px 0}h3{font:20px Georgia,serif;margin:0 0 16px}.muted{color:var(--muted)}.btn{border:1px solid var(--line);border-radius:7px;background:#fff;padding:10px 14px}.btn.primary{background:var(--dark);color:white;border-color:var(--dark)}.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}.btn.small{padding:6px 10px;font-size:12px}.buttonbar{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.stat{background:var(--paper);padding:20px;border:1px solid var(--line);border-radius:11px}.stat b{font:30px Georgia,serif;display:block}.stat span{font-size:12px;color:#737373}.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:20px;margin-bottom:16px}.item{border-bottom:1px solid var(--line);padding:13px 0;display:flex;gap:10px;align-items:flex-start}.item:last-child{border:0}.item strong{display:block}.item .details{font-size:12px;color:var(--muted);margin-top:3px}.item .grow{flex:1;min-width:0}.tag{display:inline-block;background:#f1eee9;color:#6d5a3c;border-radius:15px;padding:3px 8px;font-size:11px;margin-left:4px}.priority-high{color:var(--red)}.priority-medium{color:#947333}.priority-low{color:var(--green)}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}input,select,textarea{border:1px solid #d8d5d0;border-radius:7px;background:#fff;padding:11px;width:100%;color:var(--ink)}textarea{min-height:95px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:block;font-size:12px;color:#626262;margin-bottom:5px}.fieldwrap{margin-bottom:12px}.hidden{display:none!important}.empty{color:#777;padding:24px 0;text-align:center}.progress{background:#e9e6e1;border-radius:20px;height:8px;overflow:hidden;margin-top:8px}.progress i{display:block;background:var(--gold);height:100%}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.day{min-height:92px;border:1px solid var(--line);border-radius:7px;padding:7px;background:white}.day.today{border:2px solid var(--gold)}.day .num{font-weight:bold;color:#777}.day .event{font-size:10px;background:#eee8dc;padding:3px 4px;margin-top:4px;border-radius:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.dayhead{text-align:center;font-size:11px;color:#777}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.project{border:1px solid var(--line);padding:16px;border-radius:8px}.project h4{margin:0 0 6px;font-size:15px}.quote{border-left:3px solid var(--gold);padding:10px 14px;background:#f7f3eb}.desktoponly{}dialog{border:0;border-radius:12px;padding:0;width:min(560px,calc(100vw - 24px));max-height:90vh;overflow:auto;box-shadow:0 20px 70px #0003}dialog::backdrop{background:#16161691}.modalhead{background:var(--dark);color:white;padding:17px 20px;display:flex;justify-content:space-between}.modalbody{padding:20px}.modalhead button{background:none;border:0;color:white;font-size:22px}.notice{font-size:12px;border:1px solid #e4d3b8;background:#fdf8ee;padding:12px;border-radius:8px}.sidebarfooter{margin:32px 12px 0;font-size:11px;color:#aaa}.menu{display:none}.navhead{display:flex;align-items:center;justify-content:space-between}@media(max-width:900px){aside{width:220px}main{margin-left:220px;padding:23px}.grid2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){aside{position:static;width:100%;height:auto;padding:10px 15px}aside h1{font-size:22px}aside small{margin:0 12px 8px;font-size:9px}nav{display:flex;overflow:auto;gap:5px;padding-bottom:5px}nav button{width:auto;white-space:nowrap;font-size:11px;padding:9px}nav span{font-size:14px;width:auto}.sidebarfooter{display:none}main{margin:0;padding:18px 13px}.top{align-items:flex-start;flex-direction:column}.stats{gap:8px}.stat{padding:13px}.stat b{font-size:24px}.cards,.formgrid{grid-template-columns:1fr}.day{min-height:67px;padding:3px}.day .event{font-size:9px}.calendar{gap:3px}h2{font-size:28px}.panel{padding:15px}}

/* BRAITT 1.5 — navegação mobile em menu lateral vertical */
.mobilebar,.navshade{display:none}
@media(max-width:650px){
 html,body{width:100%;max-width:100%;overflow-x:hidden}
 .mobilebar{display:flex;position:sticky;top:0;z-index:85;align-items:center;justify-content:space-between;gap:12px;background:#242424;color:#fff;padding:11px 16px;padding-top:max(11px,env(safe-area-inset-top));box-shadow:0 2px 12px #0002}
 .mobilebar strong{font:20px Georgia,serif;letter-spacing:2px}
 .mobilebar small{display:block;color:#c4aa7c;font-size:9px;letter-spacing:1.1px}
 .menutrigger{min-height:44px;min-width:46px;border:1px solid #777;background:#353535;color:white;border-radius:10px;padding:8px 12px;font-size:14px}
 aside{position:fixed!important;left:0;top:0;bottom:0;width:min(310px,87vw)!important;height:100dvh!important;z-index:101;transform:translateX(-105%);transition:transform .22s ease;overflow-y:auto!important;padding:24px 14px 28px!important;box-shadow:6px 0 28px #0004}
 body.menu-open aside{transform:translateX(0)}
 aside h1{font-size:25px!important} aside small{margin:4px 12px 25px!important}
 aside nav{display:flex!important;flex-direction:column!important;overflow:visible!important;gap:3px!important;padding:0!important}
 aside nav button{display:flex!important;align-items:center!important;text-align:left!important;white-space:normal!important;width:100%!important;min-height:46px!important;font-size:14px!important;padding:12px 14px!important;margin:0!important}
 aside nav span{font-size:19px!important;width:30px!important;flex-shrink:0}

 body.menu-open{overflow:hidden}

 main{margin:0!important;padding:15px 12px calc(24px + env(safe-area-inset-bottom))!important;width:100%;max-width:100%;min-width:0}
 .top{gap:12px;margin-bottom:17px}.top .buttonbar{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}.top .buttonbar .btn{width:100%;min-height:44px;padding:10px 5px;font-size:12px}
 h2{font-size:26px!important}h3{font-size:19px}.panel{padding:14px!important}.item{min-width:0;flex-wrap:wrap}.item .grow{min-width:0;overflow-wrap:anywhere}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}.stat{padding:12px!important;min-width:0}.stat b{font-size:24px!important}.stat span{overflow-wrap:anywhere}
 .grid2,.cards,.formgrid{grid-template-columns:minmax(0,1fr)!important}
 .buttonbar{gap:7px}.buttonbar .btn{min-height:42px}.filters{flex-direction:column}.filters select,.filters input{width:100%}
 .calendar{gap:2px!important}.day{min-height:55px!important;padding:3px!important;overflow:hidden}.day .event{font-size:8px!important;line-height:1.2}.day .num{font-size:11px}.dayhead{font-size:9px}
 dialog{width:calc(100vw - 16px);max-height:90dvh}.modalbody{padding:15px}
}

</style></head><body>
<div class="mobilebar"><div><strong>BRAITT</strong><small>MY MANAGEMENT</small></div><button class="menutrigger" type="button" aria-label="Abrir menu vertical" aria-controls="nav" aria-expanded="false" onclick="toggleMobileMenu()">☰ Menu</button></div><div class="navshade" onclick="closeMobileMenu()"></div><aside><button class="navclose" type="button" aria-label="Fechar menu" onclick="closeMobileMenu()">×</button><h1>BRAITT</h1><small>MY MANAGEMENT</small><nav id="nav"></nav><div class="sidebarfooter">Sua rotina. Suas prioridades.<br>Seu próximo nível.</div></aside><main><div class="top"><div><div class="eyebrow" id="sectionHint">Painel Executivo</div><h2 id="pageTitle">Meu dia</h2><div class="muted" id="subtitle"></div></div><div class="buttonbar"><button class="btn" onclick="exportData()">↓ Exportar dados</button><button class="btn primary" onclick="openModal('task')">+ Nova atividade</button></div></div><div id="page"></div></main>
<dialog id="modal"><div class="modalhead"><b id="modalTitle">Novo registro</b><button onclick="document.getElementById('modal').close()">×</button></div><form id="entryForm" class="modalbody"><div id="formFields"></div><div class="buttonbar"><button class="btn primary" type="submit">Salvar</button><button class="btn" type="button" onclick="document.getElementById('modal').close()">Cancelar</button></div></form></dialog>
<script>

function toggleMobileMenu(){const open=!document.body.classList.contains('menu-open');document.body.classList.toggle('menu-open',open);const b=document.querySelector('.menutrigger');if(b)b.setAttribute('aria-expanded',String(open))}
function closeMobileMenu(){document.body.classList.remove('menu-open');const b=document.querySelector('.menutrigger');if(b)b.setAttribute('aria-expanded','false')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMobileMenu()});
const STORE='braitt-mm-v1';const sections=[['dashboard','▦','Visão geral'],['tasks','☑','Atividades'],['calendar','▦','Agenda'],['projects','◈','Projetos'],['delegation','⇢','Delegação'],['career','✦','Carreira e estudos'],['personal','♡','Pessoal e família'],['goals','◉','Metas e indicadores'],['assistant','✧','Assistente inteligente'],['settings','⚙','Dados e configurações']];
const iso=(d)=>{let x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};const today=()=>iso(new Date());const days=(n)=>{let d=new Date();d.setDate(d.getDate()+n);return iso(d)};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Math.random().toString(36).slice(2,11);
const initial=()=>({tasks:[{id:uid(),title:'Revisar prioridades da semana',date:today(),time:'09:00',priority:'Alta',category:'Profissional',status:'Pendente',project:'',assignee:'',minutes:30},{id:uid(),title:'Reservar tempo para desenvolvimento profissional',date:today(),time:'18:30',priority:'Média',category:'Carreira',status:'Pendente',project:'',assignee:'',minutes:45},{id:uid(),title:'Planejar compromissos familiares',date:days(1),time:'17:00',priority:'Média',category:'Pessoal',status:'Pendente',project:'',assignee:'',minutes:20}],projects:[{id:uid(),title:'Planejamento estratégico profissional',area:'Carreira',deadline:days(30),status:'Em andamento',description:'Organizar os próximos passos de desenvolvimento.'}],goals:[{id:uid(),title:'Concluir 80% das tarefas no prazo',area:'Produtividade',target:80,current:0,unit:'%',deadline:days(30)}],notes:[],settings:{name:'',weekStart:'Segunda'}});
let db;try{db=JSON.parse(localStorage.getItem(STORE))||initial()}catch{db=initial()}let section='dashboard',calOffset=0,taskFilter='Todas';const save=()=>localStorage.setItem(STORE,JSON.stringify(db));save();
function nav(){document.getElementById('nav').innerHTML=sections.map(([k,i,n])=>`<button class="${k===section?'active':''}" onclick="go('${k}')"><span>${i}</span>${n}</button>`).join('')}function go(k){section=k;closeMobileMenu();nav();render();window.scrollTo(0,0)}function dateFmt(s){if(!s)return 'Sem prazo';let [y,m,d]=s.split('-');return `${d}/${m}/${y}`}function title(t){document.getElementById('pageTitle').textContent=t;document.getElementById('sectionHint').textContent='BRAITT / MY MANAGEMENT';document.getElementById('subtitle').textContent= new Intl.DateTimeFormat('pt-BR',{dateStyle:'full'}).format(new Date())}
const completed=()=>db.tasks.filter(t=>t.status==='Concluída').length, overdue=()=>db.tasks.filter(t=>t.status!=='Concluída'&&t.date&&t.date<today()).length;const pct=(a,b)=>b?Math.round(100*a/b):0;const pri=t=>({Alta:0,Média:1,Baixa:2}[t.priority]??3);const order=(a,b)=>Number(a.status==='Concluída')-Number(b.status==='Concluída')||pri(a)-pri(b)||(a.date||'9999').localeCompare(b.date||'9999');
function taskRow(t){return `<div class="item"><input style="width:18px;margin-top:3px;accent-color:#b49155" aria-label="Concluir ${esc(t.title)}" type="checkbox" ${t.status==='Concluída'?'checked':''} onchange="toggleTask('${t.id}',this.checked)"><div class="grow"><strong style="${t.status==='Concluída'?'text-decoration:line-through;color:#999':''}">${esc(t.title)}</strong><div class="details">${dateFmt(t.date)} ${esc(t.time||'')} · <span class="priority-${t.priority==='Alta'?'high':t.priority==='Média'?'medium':'low'}">${esc(t.priority)}</span> · ${esc(t.category)} ${t.assignee?'· Responsável: '+esc(t.assignee):''} ${t.minutes?'· '+Number(t.minutes)+' min':''}</div></div><button class="btn small" onclick="openModal('task','${t.id}')">Editar</button><button class="btn small" aria-label="Excluir" onclick="remove('tasks','${t.id}')">×</button></div>`}
function render(){const p=document.getElementById('page');let r='';if(section==='dashboard'){title('Meu dia');const active=db.tasks.filter(t=>t.status!=='Concluída'),todayTasks=db.tasks.filter(t=>t.date===today()).sort(order),priority=active.filter(t=>t.priority==='Alta').sort(order).slice(0,3);r=`<div class="stats"><div class="stat"><b>${active.length}</b><span>Atividades abertas</span></div><div class="stat"><b>${todayTasks.length}</b><span>Programadas hoje</span></div><div class="stat"><b>${overdue()}</b><span>Em atraso</span></div><div class="stat"><b>${pct(completed(),db.tasks.length)}%</b><span>Concluídas no total</span></div></div><div class="grid2"><div><div class="panel"><h3>Agenda de hoje</h3>${todayTasks.length?todayTasks.map(taskRow).join(''):'<div class="empty">Sem atividades agendadas para hoje.</div>'}</div><div class="panel"><h3>Projetos em andamento</h3>${db.projects.map(x=>`<div class="item"><div class="grow"><strong>${esc(x.title)}</strong><div class="details">${esc(x.area)} · ${esc(x.status)} · até ${dateFmt(x.deadline)}</div></div></div>`).join('')||'<div class="empty">Cadastre seu primeiro projeto.</div>'}</div></div><div><div class="panel"><h3>3 prioridades sugeridas</h3>${priority.map((t,i)=>`<div class="item"><span class="tag">${i+1}</span><div class="grow"><strong>${esc(t.title)}</strong><div class="details">${dateFmt(t.date)} · ${esc(t.category)}</div></div></div>`).join('')||'<div class="empty">Nenhuma prioridade alta em aberto.</div>'}<button class="btn" onclick="go('assistant')">Ver minhas sugestões →</button></div><div class="panel"><h3>Foco da semana</h3><div class="quote">O objetivo não é fazer tudo. É avançar no que gera mais resultado.</div></div></div></div>`}
else if(section==='tasks'){title('Atividades e prioridades');let list=db.tasks.filter(t=>taskFilter==='Todas'||(taskFilter==='Atrasadas'?t.status!=='Concluída'&&t.date<today():taskFilter==='Pendentes'?t.status!=='Concluída':t.category===taskFilter)).sort(order);r=`<div class="filters">${['Todas','Pendentes','Atrasadas','Profissional','Carreira','Pessoal'].map(x=>`<button class="btn small ${taskFilter===x?'primary':''}" onclick="taskFilter='${x}';render()">${x}</button>`).join('')}</div><div class="panel">${list.map(taskRow).join('')||'<div class="empty">Nenhuma atividade para este filtro.</div>'}</div>`}
else if(section==='calendar'){title('Minha agenda');let m=new Date();m.setDate(1);m.setMonth(m.getMonth()+calOffset);let y=m.getFullYear(),month=m.getMonth(),first=(m.getDay()+6)%7,last=new Date(y,month+1,0).getDate();r=`<div class="panel"><div class="top"><h3>${new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(m)}</h3><div class="buttonbar"><button class="btn small" onclick="calOffset--;render()">←</button><button class="btn small" onclick="calOffset=0;render()">Hoje</button><button class="btn small" onclick="calOffset++;render()">→</button></div></div><div class="calendar">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(d=>`<div class="dayhead">${d}</div>`).join('')}${Array.from({length:first},()=>'<div></div>').join('')}${Array.from({length:last},(_,i)=>{let dt=iso(new Date(y,month,i+1)),events=db.tasks.filter(t=>t.date===dt).sort((a,b)=>(a.time||'').localeCompare(b.time||''));return `<div class="day ${dt===today()?'today':''}"><div class="num">${i+1}</div>${events.slice(0,3).map(t=>`<div title="${esc(t.title)}" class="event">${esc(t.time)} ${esc(t.title)}</div>`).join('')}${events.length>3?'<div class="event">+'+(events.length-3)+' mais</div>':''}</div>`}).join('')}</div><p class="muted" style="font-size:12px">Esta agenda reúne atividades cadastradas no BRAITT. A sincronização bidirecional com o Google Calendar ainda não está ativada nesta versão.</p></div>`}
else if(section==='projects'){title('Projetos profissionais');r=`<div class="buttonbar" style="margin-bottom:15px"><button class="btn primary" onclick="openModal('project')">+ Novo projeto</button></div><div class="cards">${db.projects.map(x=>`<div class="project"><div class="eyebrow">${esc(x.area)}</div><h4>${esc(x.title)}</h4><p class="muted">${esc(x.description||'Sem descrição')}</p><div class="details">${esc(x.status)} · Prazo: ${dateFmt(x.deadline)}</div><div class="buttonbar" style="margin-top:12px"><button class="btn small" onclick="openModal('project','${x.id}')">Editar</button><button class="btn small" onclick="remove('projects','${x.id}')">Excluir</button></div></div>`).join('')}</div>`}
else if(section==='delegation'){title('Delegação e equipe');const a=db.tasks.filter(t=>t.assignee);r=`<div class="panel"><h3>Atividades atribuídas</h3><p class="muted">Cadastre uma atividade e informe o responsável. O acompanhamento é local: atribuir não envia uma notificação à pessoa.</p>${a.map(taskRow).join('')||'<div class="empty">Ainda não há tarefas delegadas.</div>'}<button class="btn primary" onclick="openModal('task')">+ Delegar atividade</button></div>`}
else if(section==='career'||section==='personal'){let personal=section==='personal';title(personal?'Rotina pessoal e família':'Carreira e estudos');let group=personal?'Pessoal':'Carreira';r=`<div class="panel"><h3>${personal?'Compromissos pessoais':'Desenvolvimento profissional'}</h3>${db.tasks.filter(t=>t.category===group).sort(order).map(taskRow).join('')||'<div class="empty">Nenhuma atividade cadastrada.</div>'}<button class="btn primary" onclick="openModal('task')">+ Adicionar atividade</button></div><div class="panel"><h3>Metas relacionadas</h3>${db.goals.filter(g=>g.area===group).map(goalRow).join('')||'<div class="muted">Você pode cadastrar metas específicas desta área.</div>'}</div>`}
else if(section==='goals'){title('Metas e indicadores');r=`<div class="stats"><div class="stat"><b>${pct(completed(),db.tasks.length)}%</b><span>Taxa geral de conclusão</span></div><div class="stat"><b>${overdue()}</b><span>Tarefas em atraso</span></div><div class="stat"><b>${db.projects.filter(p=>p.status==='Em andamento').length}</b><span>Projetos em execução</span></div><div class="stat"><b>${db.tasks.filter(t=>t.assignee&&t.status!=='Concluída').length}</b><span>Delegações pendentes</span></div></div><div class="panel"><div class="top"><h3>Metas cadastradas</h3><button class="btn primary" onclick="openModal('goal')">+ Nova meta</button></div>${db.goals.map(goalRow).join('')||'<div class="empty">Cadastre sua primeira meta.</div>'}</div><div class="notice">Os indicadores usam somente os dados cadastrados aqui. A taxa geral de conclusão não mede cumprimento de prazos históricos.</div>`}
else if(section==='assistant'){title('Assistente inteligente');const pending=db.tasks.filter(t=>t.status!=='Concluída').sort(order);const urgent=pending.filter(t=>t.date<today()),todayList=pending.filter(t=>t.date===today());const workload=todayList.reduce((s,t)=>s+(Number(t.minutes)||0),0);r=`<div class="panel"><div class="eyebrow">Análise da sua rotina</div><h3>Seu briefing do dia</h3><p>Você tem <b>${pending.length}</b> atividades abertas, <b>${urgent.length}</b> atrasadas e <b>${todayList.length}</b> previstas para hoje${workload?`, somando aproximadamente <b>${workload} minutos</b> de esforço registrado`:''}.</p><h3>Recomendações de prioridade</h3>${pending.slice(0,3).map((t,i)=>`<div class="item"><span class="tag">${i+1}</span><div class="grow"><strong>${esc(t.title)}</strong><div class="details">${t.date<today()?'Atenção: está atrasada. ':''}${t.priority==='Alta'?'Prioridade alta. ':''}${t.assignee?'Acompanhamento com '+esc(t.assignee)+'.':''}</div></div></div>`).join('')||'<div class="empty">Nenhuma pendência para priorizar. Excelente!</div>'}<p class="quote">Sugestão: reserve um bloco de foco para a atividade mais importante, reagende o que não cabe no seu dia e acompanhe o que foi delegado.</p><div class="notice">Este é um assistente baseado em regras transparentes, sem IA generativa nem acesso aos seus dados fora do navegador. Uma integração futura poderá oferecer conversa natural, planejamento contextual e sincronização da agenda.</div></div>`}

function paretoPage(){title('Foco 80/20 e execução');const tasks=db.tasks.filter(t=>t.status!=='Concluída');let ranked=[...tasks].sort((a,b)=>impactScore(b)-impactScore(a)||pri(a)-pri(b));let core=ranked.filter(t=>classify(t)==='Executar').slice(0,3);let todayPlans=tasks.filter(t=>t.date===today()),mins=todayPlans.reduce((n,t)=>n+(Number(t.minutes)||30),0);let overload=mins>360||todayPlans.length>5;let delegatedCount=tasks.filter(delegated).length;return `<div class="panel"><div class="eyebrow">BRAITT / DECISÕES ANTES DE AÇÕES</div><h3>Caixa de entrada: despeje as pendências</h3><p class="muted">Cole uma atividade por linha. Não precisa organizar agora: o BRAITT vai sugerir o destino inicial de cada item. Pode usar o microfone na área Rotina automática para cadastrar tarefas por voz.</p><textarea id="intake" rows="4" placeholder="Rever resultado comercial\nResponder solicitação rotineira\nPreparar entrevista de emprego"></textarea><div class="buttonbar"><button class="btn primary" onclick="intake()">Analisar minhas pendências</button><button class="btn" onclick="go('planner')">🎙 Usar comando por voz</button></div></div><div class="stats"><div class="stat"><b>${tasks.length}</b><span>Pendências abertas</span></div><div class="stat"><b>${core.length}</b><span>Focos recomendados</span></div><div class="stat"><b>${delegatedCount}</b><span>Potencialmente delegáveis</span></div><div class="stat"><b>${Math.round(mins/60*10)/10}h</b><span>Tarefas previstas hoje*</span></div></div>${overload?'<div class="pill warn"><strong>⚠ Risco de sobrecarga</strong><div>Mais de 5 tarefas ou 6 horas de tarefas marcadas hoje. Reavalie antes de aceitar novas demandas.</div></div>':'<div class="pill ok">Carga de tarefas cadastradas dentro do limite de triagem. Confirme também os blocos de rotina na aba Rotina automática.</div>'}<div class="panel"><h3>Suas 3 entregas de maior impacto</h3>${core.length?core.map((t,i)=>`<div class="item"><strong class="tag">${i+1}</strong><div class="grow"><str const kind=/\b(reuniao|alinhamento|call)\b/.test(norm)?'Reunião':/\b(consulta|aniversario|compromisso|evento|retorno)\b/.test(norm)?'Compromisso':/\b(todo dia|diariamente|toda semana|semanal|recorrente|fixo)\b/.test(norm)?'Recorrente':'Tarefa';t.kind=kind;
const exact=!!t.time;let slot=exact?null:recommendDateAndTime(t.minutes,t.date);

let reasons=[];if(!exact)reasons.push(slot?'Sem horário informado: sugeri a primeira janela disponível dentro do planejamento.':'Não encontrei vaga nos próximos 14 dias: mantenha sem horário ou reorganize a agenda.');if(!explicit)reasons.push('Não foi informada uma prioridade: classifiquei provisoriamente como Prata.');if(delegate)reasons.push('Esta demanda parece operacional. Você realmente precisa executá-la ou pode delegar?');if(conflict)reasons.push('Há conflito com um compromisso ou bloco de rotina nesse horário.');if(total>limit)reasons.push('Alerta vermelho: a carga estimada desse dia ultrapassa o limite configurado. Proteja descanso e tempo pessoal.');
smartDraft={kind:'task',task:t};

function braittAgendaEvents(date){let tasks=db.tasks.filter(t=>t.date===date).map(t=>({title:t.title,time:t.time||'',minutes:Number(t.minutes)||30,area:braittArea(t),status:t.status}));let fixed=(db.routines||[]).filter(r=>r.type==='schedule'&&r.days?.includes(dayOfWeek(date))).map(r=>({title:r.name,time:r.time,minutes:r.minutes||30,area:r.area==='Carreira'?'Estudos':r.area||'Pessoal',fixed:true}));return [...tasks,...fixed,...yanEvents(date)].sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'))}
let braittAgendaMode='day',braittSelectedDay=today();
function braittDateMove(n){let d=new Date(braittSelectedDay+'T12:00:00');d.setDate(d.getDate()+n);braittSelectedDay=iso(d);render()}
function braittSelectDay(date){braittSelectedDay=date;braittAgendaMode='day';render()}
function braittMonthMove(n){let d=new Date(braittSelectedDay+'T12:00:00');d.setMonth(d.getMonth()+n,1);braittSelectedDay=iso(d);render()}
function braittDayHtml(){let date=braittSelectedDay,events=braittAgendaEvents(date),f=new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date(date+'T12:00:00'));return `<div class="panel"><div class="top"><h3>${f}</h3><div class="buttonbar"><button class="btn small" onclick="braittDateMove(-1)">← Dia</button><button class="btn small" onclick="braittSelectedDay=today();render()">Hoje</button><button class="btn small" onclick="braittDateMove(1)">Dia →</button></div></div>${events.length?events.map(e=>{let col=braittColor[e.area]||'#888';let end=e.time&&e.minutes?clockStr(clockMin(e.time)+e.minutes):'';return `<div class="braitt-agenda-row" style="--event-color:${col}"><div class="braitt-agenda-hour">${e.time?`${e.time}${end?'–'+end:''}`:'Sem horário'}</div><div class="braitt-agenda-body"><b>${esc(e.title)}</b><small>${esc(e.area)}${e.recurring?' · Yan · recorrente até 30/11/2026':''}${e.fixed?' · rotina fixa':''}${e.status?' · '+esc(e.status):''}</small></div></div>`}).join(''):'<p class="muted">Nenhuma atividade cadastrada para este dia.</p>'}</div>`}
function braittMonthHtml(){let d=new Date(braittSelectedDay+'T12:00:00');d.setDate(1);let y=d.getFullYear(),m=d.getMonth(),first=(d.getDay()+6)%7,last=new Date(y,m+1,0).getDate();return `<div class="panel"><div class="top"><h3>${new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(d)}</h3><div class="buttonbar"><button class="btn small" onclick="braittMonthMove(-1)">←</button><button class="btn small" onclick="braittSelectedDay=today();render()">Hoje</button><button class="btn small" onclick="braittMonthMove(1)">→</button></div></div><div class="calendar">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>`<div class="dayhead">${x}</div>`).join('')}${Array.from({length:first},()=>'<div></div>').join('')}${Array.from({length:last},(_,i)=>{let date=iso(new Date(y,m,i+1)),ev=braittAgendaEvents(date),dots=[...new Set(ev.map(e=>e.area))];return `<button type="button" class="day braitt-daypick ${date===today()?'today':''}" onclick="braittSelectDay('${date}')" title="Abrir dia ${i+1}"><span class="num">${i+1}</span><div>${dots.slice(0,4).map(a=>`<i class="braitt-dot" style="background:${braittColor[a]||'#888'}"></i>`).join('')}</div><small>${ev.length?ev.length+' eventos':''}</small></button>`}).join('')}</div><p class="mini">Toque em qualquer dia para ver a programação completa e os horários.</p></div>`}
function braittCalendarPage(){title('Minha agenda');let legend=['Família','Estudos','Pessoal','Trabalho'];document.getElementById('page').innerHTML=`<div class="braitt-tabs"><button class="btn ${braittAgendaMode==='day'?'primary':''}" onclick="braittAgendaMode='day';render()">Agenda do dia</button><button class="btn ${braittAgendaMode==='month'?'primary':''}" onclick="braittAgendaMode='month';render()">Agenda geral · mês</button></div><div class="braitt-legend">${legend.map(a=>`<span><i class="braitt-dot" style="background:${braittColor[a]}"></i>${a}</span>`).join('')}</div>${braittAgendaMode==='month'?braittMonthHtml():braittDayHtml()}<div class="notice">Os horários recorrentes do Yan estão disponíveis de 08/10 a 30/11/2026. A aula de música do Yan ocorre às quartas, 17h30–18h. A agenda do BRAITT não está sincronizada com o Google Calendar.</div>`}
const braittRenderBefore18=render;render=function(){if(section==='calendar'){braittCalendarPage();return}braittRenderBefore18()};
const braittScheduleBefore18=scheduleBlocks;scheduleBlocks=function(date){let base=braittScheduleBefore18(date);return [...base,...yanEvents(date).filter(e=>e.time).map(e=>({start:clockMin(e.time),end:clockMin(e.time)+e.minutes,title:e.title,kind:'Família',id:e.id+'-'+date}))].sort((a,b)=>a.start-b.start)};
render();
</script>
</body></html>
